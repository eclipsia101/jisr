name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.JISR_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Restore release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.JISR_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "JISR_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Set version
        run: echo "VERSION_NAME=1.0.$((GITHUB_RUN_NUMBER - 1))" >> "$GITHUB_ENV"
      - name: Release APK
        env:
          JISR_KEYSTORE_PASSWORD: ${{ secrets.JISR_KEYSTORE_PASSWORD }}
          JISR_KEY_ALIAS: ${{ secrets.JISR_KEY_ALIAS }}
          JISR_KEY_PASSWORD: ${{ secrets.JISR_KEY_PASSWORD }}
          JISR_REQUIRE_RELEASE_SIGNING: ${{ env.HAS_SIGNING == 'true' && github.event_name != 'pull_request' }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Name the APKs
        run: |
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi="${f##*/app-}"; abi="${abi%-release.apk}"
            cp "$f" "Jisr-${{ env.VERSION_NAME }}-$abi.apk"
          done
          ls Jisr-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jisr-release${{ env.HAS_SIGNING == 'true' && '' || '-UNSIGNED-DEBUG-KEY' }}
          path: Jisr-${{ env.VERSION_NAME }}-*.apk
          if-no-files-found: error
      - name: Publish release
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Jisr ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: Jisr-${{ env.VERSION_NAME }}-*.apk
          generate_release_notes: true
